# Ref: https://github.com/spiffe/helm-charts-hardened/blob/main/charts/spire/values.yaml

global:
  spire:
    trustDomain: "example.org"
    tools:
      kubectl:
        # renovate: datasource=docker depName=registry.k8s.io/kubectl
        tag: "v1.28.0"

  installAndUpgradeHooks:
    enabled: false

  deleteHooks:
    enabled: false

spire-server:
  image:
    # renovate: datasource=docker depName=ghcr.io/spiffe/spire-server
    tag: "1.16.0"

  federation:
    enabled: true

  controllerManager:
    image:
      # renovate: datasource=docker depName=ghcr.io/spiffe/spire-controller-manager
      tag: "0.8.1"
    className: dir-spire

# This dev environment uses X.509 SPIFFE identities plus Dex/GitHub OIDC.
# Disable the SPIRE OIDC discovery provider until upstream ships a helper image
# without the currently open high/critical Trivy findings.
spire-agent:
  image:
    # renovate: datasource=docker depName=ghcr.io/spiffe/spire-agent
    tag: "1.16.0"

spiffe-oidc-discovery-provider:
  enabled: false

spiffe-csi-driver:
  image:
    # renovate: datasource=docker depName=ghcr.io/spiffe/spiffe-csi-driver
    tag: "0.3.0"
  nodeDriverRegistrar:
    image:
      # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: "v2.18.0"
